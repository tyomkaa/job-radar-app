name: PWA Smoke Tests
on:
  push:
    branches: [main, feature/v07-unified-workspace, feature/compact-cards-hide-why, feature/v10-ai-budget-visibility, feature/v11-better-local-templates, feature/v12-daily-workflow-fixes, feature/v13-unified-daily-focus, feature/v14-clear-daily-focus, feature/v16-ukrainian-employers, feature/v17-fresh-opportunities-tab]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PWA
        run: |
          node tests/ui-smoke.mjs
          node tests/ua-employer-matching.mjs
          node tests/compact-filters-integration.mjs
          node tests/disputed-ai-skip-integration.mjs
          node tests/daily-feed-revision-integration.mjs
          node tests/daily-ai-conflict-check-integration.mjs
          node tests/daily-ai-check-ready-state.mjs
          node tests/daily-unified-list-integration.mjs
