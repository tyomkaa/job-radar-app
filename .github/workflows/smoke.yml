name: PWA Smoke Tests
on:
  push:
    branches: [main, feature/v07-unified-workspace]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PWA
        run: node tests/ui-smoke.mjs
