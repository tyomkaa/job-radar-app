name: Deploy Job Radar PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub's artifact metadata API may lag a successfully uploaded
      # Pages artifact. Run #240 failed with zero artifacts immediately after
      # a successful upload; rerunning that same run created duplicate
      # artifacts. A fresh run plus a brief indexing delay prevents the race.
      - name: Allow Pages artifact metadata to become visible
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
